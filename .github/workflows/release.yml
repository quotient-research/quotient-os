name: release
# Builds the Quotient Mainframe OS ISO on a GitHub runner and publishes it:
# sha256 checksums signed with the Quotient APT key, the files in the website's
# Azure storage (container "os", read by the download page through latest.json),
# and a GitHub Release with the checksum files. About 25 minutes.
#
# Secrets: GPG_PRIVATE_KEY (the APT signing key, as in quotient-server),
# AZURE_STORAGE_ACCOUNT_NAME and AZURE_STORAGE_ACCOUNT_KEY (the production
# website storage account, stquotientwebprod).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (default: today's date, 2026.11.04)"
        required: false
        default: ""
      channel:
        description: "quotient-server-tools channel the ISO installs"
        type: choice
        default: stable
        options: [stable, preview, dev]
      publish:
        description: "Sign, upload to Azure and create the GitHub Release (off: build only)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: release
jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: console/go.mod
      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin grub-common \
            mtools dosfstools librsvg2-bin gnupg curl >/dev/null
          sudo mkdir -p /mnt/quotient-os && df -h / /mnt | sed 's/^/  /'
      - name: Version
        id: v
        run: |
          V="${{ inputs.version }}"; [ -n "$V" ] || V=$(date -u +%Y.%m.%d)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Quotient Mainframe OS $V (${{ inputs.channel }})" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the ISO
        run: |
          sudo PATH="$PATH" ./build/build-iso.sh --channel "${{ inputs.channel }}" \
            --version "${{ steps.v.outputs.version }}" --work /mnt/quotient-os --out "$PWD/out" \
            | grep -v '^\s*$' | tail -n 200
          sudo chown -R "$(id -u):$(id -g)" out
          ls -lh out/*.iso
          sudo rm -rf /mnt/quotient-os/chroot /mnt/quotient-os/iso
      - name: Import the APT signing key
        if: inputs.publish
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "::error::GPG_PRIVATE_KEY is not set; an ISO is never published unsigned"; exit 1; }
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import 2>&1 | grep -v '^gpg: key' || true
          gpg --batch --list-secret-keys --with-colons | grep -q '^fpr:.*AE772CBCB3BC29B247A794256781AAC9BFEA7E51' \
            || { echo "::error::the imported key is not the Quotient APT key"; exit 1; }
      - name: Publish
        if: inputs.publish
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$AZURE_STORAGE_KEY" ] || { echo "::error::AZURE_STORAGE_ACCOUNT_KEY is not set"; exit 1; }
          ./build/publish.sh --iso out/quotient-mainframe-os-${{ steps.v.outputs.version }}-${{ inputs.channel }}-amd64.iso
          { echo; echo '```'; cat out/latest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Checksum (build only)
        if: ${{ !inputs.publish }}
        run: |
          ./build/publish.sh --iso out/quotient-mainframe-os-${{ steps.v.outputs.version }}-${{ inputs.channel }}-amd64.iso --no-sign --no-upload --no-release
          { echo; echo '```'; cat out/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/build-*.log
          if-no-files-found: ignore
