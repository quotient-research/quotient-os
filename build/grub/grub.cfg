set timeout=5
set default=0
# No insmod: the signed EFI GRUB has everything built in and refuses external
# modules under Secure Boot; the BIOS core image is built with the same set.
if loadfont /boot/grub/font.pf2 ; then
  set gfxmode=auto
  terminal_output gfxterm
  loadfont /boot/grub/theme/unicode.pf2
  loadfont /boot/grub/theme/jost30.pf2
  set theme=/boot/grub/theme/theme.txt
  export theme
fi
set menu_color_normal=white/black
set menu_color_highlight=black/light-green

# A harness build carries answers on the medium: install without asking.
if [ -f /quotient/answers.conf ]; then
  set default=3
  set timeout=1
fi

menuentry "Set up Quotient Mainframe OS @VERSION@" {
  linux /live/vmlinuz boot=live components quiet splash ---
  initrd /live/initrd.img
}
menuentry "Set up Quotient Mainframe OS (safe graphics)" {
  linux /live/vmlinuz boot=live components nomodeset ---
  initrd /live/initrd.img
}
menuentry "Boot from the hard disk" {
  exit
}
menuentry "Unattended install (answers.conf on this medium)" {
  linux /live/vmlinuz boot=live components quotient.unattended=1 console=tty1 console=ttyS0,115200n8 ---
  initrd /live/initrd.img
}
