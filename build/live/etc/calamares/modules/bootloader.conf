# Ubuntu's signed shim looks for /EFI/ubuntu/grub.cfg on the ESP, so the EFI
# entry id must be "ubuntu" (the unattended engine does the same) or a Secure
# Boot machine cannot boot the result. The firmware's menu entry reads "ubuntu".
efiBootLoader: "grub"
efiBootloaderId: "ubuntu"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
