# Whole disk only: EFI + one ext4 root, no swap partition (the engine makes a
# swapfile; Calamares' install leaves swap to the postinstall), no LUKS (v1).
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512MiB
efiSystemPartitionName: EFI
userSwapChoices: [ none ]
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: false
enableLuksAutomatedPartitioning: false
initialPartitioningChoice: erase
initialSwapChoice: none
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4" ]
partitionLayout:
  - name: "quotient-root"
    filesystem: "ext4"
    mountPoint: "/"
    size: 100%
