defaultGroups:
  - name: sudo
    must_exist: true
  - adm
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
hostname:
  location: EtcFile
  writeHostsFile: true
  forbidden_names: [ localhost, quotientos, quotient-mainframe-os, quotient-kiosk ]
