# Quotient Mainframe OS installer. Pages ask only what a human must decide; the
# Quotient-specific work is one script shared with the unattended install.
modules-search: [ local ]
instances:
  - id: quotient
    module: shellprocess
    config: shellprocess-quotient.conf
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - initramfs
      - grubcfg
      - bootloader
      - shellprocess@quotient
      - umount
  - show:
      - finished
branding: quotient
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
