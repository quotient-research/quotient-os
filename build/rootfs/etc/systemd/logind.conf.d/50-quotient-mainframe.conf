# A Mainframe never sleeps: not on idle, not on the lid, not on a key. The
# sleep targets are masked too (build-iso.sh), so desktop settings can't either.
[Login]
IdleAction=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
